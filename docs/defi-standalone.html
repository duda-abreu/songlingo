<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>parcours défi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
<style>
  body { padding: 25px; }
  #tela-vazia, #tela-musica, #abrir-curso-defi { display: none; }
</style>
</head>
<body class="escuro">

<div id="tela-vazia" hidden></div>
<div id="tela-musica" hidden></div>
<button id="abrir-curso-defi" hidden></button>

<main class="area-principal">
  <section id="tela-defi" class="tela-defi" aria-labelledby="titulo-defi">
    <header class="cabecalho-defi">
      <div>
        <p class="sobretitulo-defi">frenchlingo</p>
        <h2 id="titulo-defi">parcours défi</h2>
        <p>observe, compreenda, descubra a regra e use o francês numa situação real.</p>
      </div>
      <button id="fechar-curso-defi" class="botao-arquivo" type="button" hidden>voltar às músicas</button>
    </header>

    <div class="progresso-defi" aria-label="progresso do percurso">
      <div id="barra-progresso-defi"></div>
    </div>

    <div class="layout-defi">
      <nav id="lista-unidades-defi" class="lista-unidades-defi" aria-label="Ateliers do percurso"></nav>

      <article class="atelier-defi">
        <div class="cabecalho-atelier">
          <div>
            <span id="nivel-defi" class="selo-nivel-defi"></span>
            <p id="tema-defi" class="tema-defi"></p>
            <h3 id="titulo-unidade-defi"></h3>
          </div>
          <span id="estado-unidade-defi" class="estado-unidade-defi"></span>
        </div>

        <section class="documento-defi" aria-labelledby="titulo-documento-defi">
          <span class="etiqueta-cartao">document déclencheur</span>
          <h4 id="titulo-documento-defi"></h4>
          <p id="texto-documento-defi"></p>
        </section>

        <section class="caixa-ferramentas-defi" aria-labelledby="titulo-ferramentas-defi">
          <div>
            <span>boîte à outils</span>
            <h4 id="titulo-ferramentas-defi"></h4>
          </div>
          <p id="texto-ferramentas-defi"></p>
        </section>

        <section class="atividade-defi" aria-live="polite">
          <div class="cabecalho-atividade-defi">
            <span id="tipo-atividade-defi"></span>
            <div id="passos-defi" class="passos-defi" aria-label="etapas da unidade"></div>
          </div>
          <h4 id="pergunta-defi"></h4>
          <p id="instrucao-defi" class="instrucao-defi"></p>
          <div id="opcoes-defi" class="opcoes-defi"></div>
          <textarea id="resposta-defi" rows="3" placeholder="écrivez en français" autocomplete="off"></textarea>
          <div id="feedback-defi" class="feedback-defi"></div>
          <div id="gabarito-defi" class="gabarito-defi" hidden></div>
          <div class="acoes-defi">
            <button id="mostrar-resposta-defi" class="botao-secundario" type="button">mostrar resposta</button>
            <button id="tentar-defi" class="botao-secundario" type="button" hidden>ocultar e tentar de novo</button>
            <button id="conferir-defi" class="botao-primario" type="button">conferir</button>
            <button id="proxima-atividade-defi" class="botao-primario" type="button" hidden>continuar →</button>
          </div>
        </section>
      </article>
    </div>
  </section>
</main>

<script src="defi-data.js?v=2"></script>
<script src="defi.js?v=2"></script>
<script>
  document.getElementById("abrir-curso-defi").click();
</script>
</body>
</html>
